[versions]
testcontainers = "2.0.5"

[libraries]
kafka-streams-avro-serde = { group = "io.confluent", name = "kafka-streams-avro-serde" }
streamsBootstrap-bom = { group = "com.bakdata.kafka", name = "streams-bootstrap-bom", version = "7.5.0" }
streamsBootstrap-cli = { group = "com.bakdata.kafka", name = "streams-bootstrap-cli" }
log4j-slf4j2 = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version = "2.26.1" }
opencsv = { group = "com.opencsv", name = "opencsv", version = "5.12.0" }
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind", version = "3.2.2" }

junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version = "6.1.3" }
assertj = { group = "org.assertj", name = "assertj-core", version = "3.27.7" }
streamsBootstrap-cli-test = { group = "com.bakdata.kafka", name = "streams-bootstrap-cli-test" }
testcontainers-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-kafka = { group = "org.testcontainers", name = "testcontainers-kafka", version.ref = "testcontainers" }

[plugins]
release = { id = "com.bakdata.release", version = "2.2.1" }
sonar = { id = "com.bakdata.sonar", version = "2.2.1" }
sonatype = { id = "com.bakdata.sonatype", version = "2.2.1" }
lombok = { id = "io.freefair.lombok", version = "9.5.0" }
jib = { id = "com.bakdata.jib", version = "2.2.1" }
avro = { id = "com.bakdata.gradle.avro", version = "2.0.1" }
