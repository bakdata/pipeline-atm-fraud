name: Build and Publish

on:
  push:
    tags: ["**"]
    branches: ["**"]

env:
  java-version: 21
  gradle-version: 8.4
  gradle-cache: true
  gradle-cache-read-only: true
  gradle-refresh-dependencies: false
  working-directory: "."

jobs:
  build-and-test:
    name: Build, Test and Assess code quality
    uses: bakdata/ci-templates/.github/workflows/java-gradle-base.yaml@1.82.1
    with:
      java-version: 21
      gradle-version: 8.4
      gradle-cache: true
      gradle-cache-read-only: false
      gradle-refresh-dependencies: false
      working-directory: "."
    secrets:
      signing-key-id: ${{ secrets.SONATYPE_SIGNING_KEY_ID }}
      signing-password: ${{ secrets.SONATYPE_SIGNING_PASSWORD }}
      signing-secret-key-ring: ${{ secrets.SONATYPE_SIGNING_SECRET_KEY_RING }}
      sonar-token: ${{ secrets.SONARCLOUD_TOKEN }}
      sonar-organization: ${{ secrets.SONARCLOUD_ORGANIZATION }}

  build-jib:
    name: Build ${{ matrix.app.name }} image
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    needs: build-and-test
    strategy:
      matrix:
        app:
          - name: transaction-avro-producer
            image: bakdata/atm-demo-transactionavroproducer
            class: com.bakdata.kafka.TransactionAvroProducer
          - name: account-producer
            image: bakdata/atm-demo-accountproducer
            class: com.bakdata.kafka.AccountProducer
          - name: transaction-joiner
            image: bakdata/atm-demo-transactionjoiner
            class: com.bakdata.kafka.TransactionJoiner
          - name: fraud-detector
            image: bakdata/atm-demo-frauddetector
            class: com.bakdata.kafka.FraudDetector
          - name: account-linker
            image: bakdata/atm-demo-accountlinker
            class: com.bakdata.kafka.AccountLinker

    steps:
      - name: Login into docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }} image
        uses: bakdata/ci-templates/actions/java-gradle-build-jib@1.82.1
        with:
          repository: ${{ matrix.app.image }}
          class: ${{ matrix.app.class }}
          java-version: ${{ env.java-version }}
          gradle-version: ${{ env.gradle-version }}
          gradle-cache: ${{ env.gradle-cache }}
          gradle-cache-read-only: ${{ env.gradle-cache-read-only }}
          gradle-refresh-dependencies: ${{ env.gradle-refresh-dependencies }}
          working-directory: ${{ env.working-directory }}

  release:
    name: Create Github release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [build-and-test, build-jib]

    steps:
      - name: Release on Github
        uses: bakdata/ci-templates/actions/java-gradle-release-github@1.82.1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
